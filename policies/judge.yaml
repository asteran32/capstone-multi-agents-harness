    - id: reviewer_repair_advice
      current_response: '{"findings":[{"cause":"이전 값이 대체됩니다.","impact":"합계가 잘못됩니다.","location":"total 변수"}],"summary":"누적
        결과가 보존되지 않습니다. 대입문을 누적 덧셈으로 바꾸세요.","uncertainties":[]}'
