          candidate_code: |
            def is_positive(value: int) -> bool:
                return value > 0
      current_response: '{"findings":[],"summary":"원본의 양수 판정과 0에서 False인 예시를 후보의 분기와 대조했습니다. 후보는 0과 음수에서 거짓, 양수에서 참을 반환하므로
