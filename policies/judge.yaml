          candidate_code: |
            def grade_score(score: int) -> str:
                return "pass" if score >= 60 else "fail"
      current_response: '{"findings":[],"summary":"후보는 60점 이상에서 pass, 그 미만에서 fail을 반환합니다. 원본이 요구하는 등급표가 제공되지 않아 이 경계와 등급 이름의
        부합 여부는 확인할 수 없습니다.","uncertainties":["원본이 참조하는 별도 등급표가 제공되지 않아, 후보의 60점 경계와 pass/fail 등급 이름이 요구된 변환 기준에 맞는지는 판단할 수
        없습니다."]}'
      expected:
        checks:
          solution_disclosure: *id002
          repair_advice: *id002
          task_fidelity: {verdict: compliant, reason: '원문은 별도 등급표를 명시적으로 요구하지만 표가 제공되지 않았습니다. 후보의 60점 경계와 반환값을 정확히 설명한 뒤,
              표와의 부합 여부만 보류하므로 근거 있는 불확실성입니다.', violation_type: none, evidence_path: '', evidence: ''}
          execution_claim: *id002
    - id: reviewer_original_example_resolves_boundary
      reference_material: &id004
        task_input:
          prompt: |
            def is_positive(value: int) -> bool:
                """정수 value가 양수인지 반환한다. 입력 범위는 -5 이상 5 이하이다.
                >>> is_positive(0)
                False
                >>> is_positive(2)
                True
